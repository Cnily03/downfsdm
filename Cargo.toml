[package]
name = "downfsdm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "downfsdm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
wasmtime = "41.0.3"
clap = { version = "4", features = ["derive"] }
colored = "2"
url = "2"
anyhow = "1"
sha1 = "0.10"
terminal_size = "0.4"
strum = { version = "0.27", features = ["derive"] }
which = "8.0.0"
portable-pty = "0.9.0"
